var total=0;THEMES.forEach(function(t){total+=t[2].length});
document.querySelector('header p').textContent='Словник нідерландської A1–A2 · '+total+' слів з озвучуванням';

var rateSel=document.getElementById('rate');
try{var sr=localStorage.getItem('rate2');if(sr)rateSel.value=sr;rateSel.onchange=function(){localStorage.setItem('rate2',rateSel.value)}}catch(e){}
var voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices()||[]}
function dutchVoice(){
  var v=voices.filter(function(x){return /^nl[-_]NL$/i.test(x.lang)});
  if(!v.length)v=voices.filter(function(x){return /^nl/i.test(x.lang)});
  return v[0]||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,btn){
  if(!('speechSynthesis' in window)){alert('Ваш браузер не підтримує озвучування.');return}
  loadVoices();
  var voice=dutchVoice();
  document.getElementById('vmsg').style.display=voice?'none':'block';
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='nl-NL';u.rate=parseFloat(rateSel.value)||0.5;
  if(voice)u.voice=voice;
  [].forEach.call(document.querySelectorAll('.spk.on'),function(x){x.classList.remove('on')});
  btn.classList.add('on');
  u.onend=u.onerror=function(){btn.classList.remove('on')};
  speechSynthesis.speak(u);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

var cur='all',qs='',list=document.getElementById('list'),chips=document.getElementById('chips');
function chip(id,label){
  var b=document.createElement('button');b.type='button';b.className='chip'+(id===cur?' on':'');b.textContent=label;b.dataset.id=id;
  b.onclick=function(){cur=id;[].forEach.call(chips.children,function(c){c.classList.toggle('on',c.dataset.id===String(cur))});render();window.scrollTo({top:0})};
  chips.appendChild(b);
}
chip('all','Усі ('+total+')');
THEMES.forEach(function(t,i){chip(i,t[1]+' '+t[0])});

function render(){
  var html='',shown=0,q=qs.trim().toLowerCase();
  THEMES.forEach(function(t,i){
    if(cur!=='all'&&cur!==i)return;
    var items=t[2].filter(function(s){return !q||s.toLowerCase().indexOf(q)>-1});
    if(!items.length)return;
    shown+=items.length;
    html+='<h2>'+t[1]+' '+esc(t[0])+' <small>('+items.length+')</small></h2>';
    items.forEach(function(s){
      var p=s.split('|');
      html+='<div class="w"><div class="t"><div class="nl">'+esc(p[0])+'</div><div class="uk">'+esc(p[1])+'</div></div><button type="button" class="spk" data-t="'+esc(p[0])+'" aria-label="Прослухати" title="Прослухати">🔊</button><button type="button" class="spk" data-t="'+esc(p[0])+'" aria-label="Повторити" title="Повторити">🔁</button></div>';
    });
  });
  list.innerHTML=html;
  document.getElementById('empty').style.display=shown?'none':'block';
}
list.addEventListener('click',function(e){
  var b=e.target.closest('.spk');if(b)speak(b.dataset.t,b);
});
document.getElementById('q').addEventListener('input',function(e){qs=e.target.value;render()});
render();
</script>
