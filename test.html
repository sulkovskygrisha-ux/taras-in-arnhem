var T1="Hallo, ik heet Anna. Ik ben 25 jaar oud. Ik kom uit Oekraïne, maar ik woon nu in Utrecht. Ik werk in een café. Ik hou van koffie en muziek.|Привіт, мене звати Анна. Мені 25 років. Я родом з України, але зараз живу в Утрехті. Я працюю в кафе. Я люблю каву та музику.";
var T2="Mijn familie is klein. Ik heb een vader, een moeder en een zus. Mijn zus heet Lisa. Zij is acht jaar. Wij hebben een hond. De hond heet Max. Op zaterdag gaan wij naar het park.|Моя родина маленька. У мене є тато, мама і сестра. Мою сестру звати Ліза. Їй вісім років. У нас є собака. Собаку звати Макс. У суботу ми йдемо в парк.";
var T3="Beste Tom, volgende week zaterdag geef ik een feestje voor mijn verjaardag. Het begint om 8 uur 's avonds bij mij thuis. Ik woon aan de Kerkstraat 12. Kom je ook? Je mag een vriend meenemen. Ik zorg voor eten en drinken. Groeten, Sara|Дорогий Томе, наступної суботи я влаштовую вечірку на свій день народження. Вона починається о 8 вечора в мене вдома. Я живу на Керкстраат, 12. Ти прийдеш? Можеш взяти з собою друга. Я подбаю про їжу та напої. Вітання, Сара";
var T4="Gisteren was het slecht weer in Nederland. Het regende de hele dag en het was koud, maar vandaag schijnt de zon. De temperatuur is 18 graden. Morgen wordt het weer warm, ongeveer 22 graden. Het weekend wordt waarschijnlijk droog.|Вчора в Нідерландах була погана погода. Цілий день йшов дощ і було холодно, але сьогодні світить сонце. Температура — 18 градусів. Завтра знову потепліє, приблизно до 22 градусів. На вихідні, ймовірно, буде сухо.";
var T5="Jan werkt als monteur. Hij begint om 8 uur en eindigt om 5 uur. 's Ochtends gaat hij met de fiets naar zijn werk, want zijn auto is kapot. In de pauze eet hij een broodje met kaas. Na het werk gaat hij soms naar de sportschool. Dan komt hij pas om 8 uur thuis.|Ян працює механіком. Він починає о 8 і закінчує о 5. Зранку він їде на роботу велосипедом, бо його машина зламана. У перерву він їсть булочку із сиром. Після роботи він іноді йде в спортзал. Тоді він приходить додому лише о 8.";
var SECTIONS = [
{name:"Grammatica (граматика)", q:[
["A1","Ik ___ een student.","Я ___ студент.",["ben|є (я)","bent|є (ти)","is|є (він/вона)","zijn|є (ми/вони)"],0,"Дієслово zijn (бути): ik ben, jij bent, hij/zij is, wij/jullie/zij zijn. Після «ik» завжди ben."],
["A1","Jij ___ heel aardig.","Ти дуже добрий.",["ben|є (я)","is|є (він)","bent|є (ти)","zijn|є (ми)"],2,"Після «jij» (ти) використовуємо bent: jij bent."],
["A1","Wij ___ in Nederland.","Ми в Нідерландах.",["is|є (він)","zijn|є (ми)","ben|є (я)","bent|є (ти)"],1,"Для wij/jullie/zij (множина) форма — zijn."],
["A1","Hij ___ een fiets.","Він має велосипед.",["heb|маю","hebben|маємо","heeft|має","hebt|маєш"],2,"Дієслово hebben (мати): ik heb, jij hebt, hij/zij heeft, wij hebben. Для «hij» — heeft."],
["A1","Ik ___ twee broers.","Я маю двох братів.",["heeft|має","hebben|маємо","heb|маю","hebt|маєш"],2,"Після «ik» форма hebben — heb (без -t)."],
["A1","Welk lidwoord past? ___ tafel","Який означений артикль підходить? ___ стіл",["het|het","de|de","een|неозначений артикль","geen|жодний"],1,"Слово tafel — «de-woord». Більшість іменників мають de; решта — het (het huis, het boek). Артикль вчіть разом зі словом."],
["A1","Wat is het meervoud van «boek»?","Яка форма множини від «boek» (книга)?",["boeken|книги","boekken|—","boeks|—","boekes|—"],0,"Найчастіше множину утворюємо додаванням -en: boek → boeken."],
["A1","Ik ___ koffie.","Я п'ю каву.",["drinkt|п'є","drink|п'ю","drinken|п'ємо","gedronken|випитий"],1,"З «ik» дієслово — це основа без закінчення: ik drink. З hij/zij — drinkt, з wij — drinken."],
["A1","Zij ___ naar school.","Вона йде до школи.",["gaat|іде","ga|іду","gaan|ідемо","gaas|—"],0,"Gaan (іти): ik ga, jij gaat, hij/zij gaat, wij gaan. Для «zij» (вона) — gaat."],
["A1","Ik heb ___ auto.","У мене немає машини.",["niet|не","geen|жодної / немає","nee|ні","niets|нічого"],1,"Перед іменником із «een» або без артикля заперечення — geen (ik heb geen auto). Niet заперечує дієслово чи прикметник."],
["A1","Dit is ___ boek. (моя книга)","Це ___ книга. (моя)",["mijn|мій","jouw|твій","zijn|його","haar|її"],0,"Присвійні займенники: mijn (мій), jouw/je (твій), zijn (його), haar (її)."],
["A1","Ik woon ___ Utrecht.","Я живу в Утрехті.",["in|в","op|на","aan|до/біля","bij|біля"],0,"З містами й країнами для місця вживаємо in: in Utrecht, in Nederland."],
["A1","___ heet jij?","Як тебе звати?",["Wat|що","Wie|хто","Hoe|як","Waar|де"],2,"«Hoe heet je?» — стале питання «Як тебе звати?». Hoe = як."],
["A1","Wij ___ in een winkel.","Ми працюємо в магазині.",["werkt|працює","werk|працюю","werken|працюємо","werkte|працював"],2,"Для множини (wij, jullie, zij) дієслово має закінчення -en: werken."],
["A1","Hij komt ___ Spanje.","Він родом з Іспанії.",["uit|з","in|в","op|на","naar|до"],0,"Звідки родом — komen uit: Ik kom uit Oekraïne. Naar — напрямок руху."],
["A2","Gisteren ___ ik naar de markt.","Вчора я ходив на ринок.",["ga|іду","ging|ішов","gegaan|ходив (дієприкметник)","gaat|іде"],1,"Минулий простий час (imperfectum) від gaan — ging. Це неправильне дієслово, його форму треба вивчити."],
["A2","Ik heb gisteren een brief ___.","Вчора я написав листа.",["schreef|писав","schrijft|пише","geschreven|написаний","schrijven|писати"],2,"Перфект: hebben + дієприкметник (voltooid deelwoord) у кінці. schrijven → geschreven (неправильне)."],
["A2","Wat is het voltooid deelwoord van «werken»?","Яка форма дієприкметника від «werken»?",["gewerkt|працював","geworkt|—","werkt|працює","gewerk|—"],0,"Правильні дієслова: ge- + основа + -t/-d. werken → ge-werk-t."],
["A2","Ik ben naar huis ___.","Я пішов додому.",["gegaan|пішов","gegaat|—","gaan|іти","ging|ішов"],0,"Дієслова руху в перфекті беруть zijn: ik ben gegaan."],
["A2","Mijn broer is ___ dan ik.","Мій брат вищий/більший за мене.",["groot|великий","groter|більший","grootst|найбільший","het grootst|найбільший"],1,"Вищий ступінь: прикметник + -er (groot → groter) і слово dan (ніж)."],
["A2","Dit is de ___ stad van Nederland.","Це найгарніше місто Нідерландів.",["mooi|гарний","mooier|гарніший","mooiste|найгарніше","meer mooi|—"],2,"Найвищий ступінь перед іменником: прикметник + -ste (de mooiste stad)."],
["A2","Het is een ___ huis.","Це великий будинок.",["grote|великий","groot|великий","groten|—","grootte|—"],1,"Het-слово з «een»: до прикметника -e НЕ додаємо (een groot huis). З de-словом: een grote tafel."],
["A2","Hij ___ niet komen, want hij is ziek.","Він не може прийти, бо хворий.",["kunnen|могти (мн.)","kunt|можеш","kan|може","gekund|міг"],2,"Модальне дієслово kunnen: ik kan, jij kunt, hij kan, wij kunnen. Для «hij» — kan."],
["A2","Ik was ___ elke ochtend.","Я вмиваюся щоранку.",["me|себе (я)","hem|його","zich|себе","je|тебе"],0,"Зворотні дієслова мають займенник: ik was me, jij wast je, hij wast zich."],
["A2","Ik ___ elke dag om 7 uur op. (opstaan)","Я встаю щодня о 7. (opstaan)",["sta|встаю","staat|встає","opsta|—","staan|встаємо"],0,"Віддільні дієслова: префікс іде в кінець речення — ik sta om 7 uur op. Після «ik» — sta."],
["A2","___ is een boek op tafel.","На столі є книга.",["Het|воно","Er|там (є)","De|—","Een|—"],1,"Конструкція «er is/zijn» = є/існує: Er is een boek op tafel."],
["A2","Ik wacht ___ de bus.","Я чекаю на автобус.",["op|на","aan|до","voor|перед","bij|біля"],0,"Дієслово wachten вимагає прийменника op: wachten op iets/iemand."],
["A2","Ik ___ morgen een film kijken.","Завтра я буду дивитися фільм.",["ga|іду","gaat|іде","ging|ішов","gegaan|ходив"],0,"Майбутнє: gaan + інфінітив у кінці. Ik ga … kijken. З «ik» — ga."],
["A2","Wat is het verkleinwoord van «huis»?","Яка зменшувальна форма від «huis»?",["huisje|будиночок","huisken|—","huisetje|—","huisjes|—"],0,"Зменшувальні утворюємо додаванням -je (-tje, -etje). huis → huisje. Всі зменшувальні — het-слова."],
["A2","Ik heb geen tijd ___ koffie te drinken.","У мене немає часу пити каву.",["om|щоб","voor|для","aan|до","door|через"],0,"Конструкція «om … te + інфінітив» = щоб/для того, щоб: om koffie te drinken."]

["A1","Wat is «яблуко» in het Nederlands?","Як по-нідерландськи «яблуко»?",["peer|груша","appel|яблуко","brood|хліб","kaas|сир"],1,"Яблуко — de appel. Peer — груша, brood — хліб, kaas — сир."],
["A1","Wat is «молоко» in het Nederlands?","Як по-нідерландськи «молоко»?",["water|—","thee|—","sap|—","melk|—"],3,"De melk = молоко. Water — вода, thee — чай, sap — сік."],

["A1","Na maandag komt ___.","Після понеділка йде ___.",["woensdag|середа","dinsdag|вівторок","zondag|неділя","vrijdag|п'ятниця"],1,"Дні тижня: maandag, dinsdag, woensdag, donderdag, vrijdag, zaterdag, zondag."],
["A1","Gras is ___.","Трава — ___.",["rood|червона","blauw|синя","geel|жовта","groen|зелена"],3,"Groen = зелений. Rood — червоний, blauw — синій, geel — жовтий."],
["A1","De zus van mijn moeder is mijn ___.","Сестра моєї мами — моя ___.",["oom|дядько","tante|тітка","opa|дідусь","neef|двоюрідний брат"],1,"Tante = тітка. Oom — дядько, opa — дідусь, neef — двоюрідний брат/племінник."],
["A1","Hoe zeg je 2:30 in het Nederlands?","Як по-нідерландськи сказати 2:30?",["half vier|—","half drie|—","drie uur|—","twee uur|—"],1,"У нідерландській «half drie» = пів на третю, тобто 2:30 (а не 3:30)."],

var all=[], quiz=document.getElementById('quiz');
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var rateSel=document.getElementById('rate');try{var sr=localStorage.getItem('rate');if(sr)rateSel.value=sr;rateSel.onchange=function(){localStorage.setItem('rate',rateSel.value)}}catch(e){}
var voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices()||[]}
function dutchVoice(){
  var v=voices.filter(function(x){return /^nl[-_]NL$/i.test(x.lang)});
  if(!v.length)v=voices.filter(function(x){return /^nl/i.test(x.lang)});
  return v[0]||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,btn){
  if(!('speechSynthesis' in window)){alert('Ваш браузер не підтримує озвучування.');return}
  loadVoices();
  var voice=dutchVoice();
  document.getElementById('vmsg').style.display=voice?'none':'block';
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='nl-NL';u.rate=parseFloat(document.getElementById('rate').value)||0.65;
  if(voice)u.voice=voice;
  [].forEach.call(document.querySelectorAll('.spk.on'),function(x){x.classList.remove('on')});
  btn.classList.add('on');
  u.onend=u.onerror=function(){btn.classList.remove('on')};
  speechSynthesis.speak(u);
}
var n=0;
SECTIONS.forEach(function(sec){
  var h=document.createElement('h2');h.className='sec';h.textContent=sec.name;quiz.appendChild(h);
  sec.q.forEach(function(d){
    var idx=n++;
    var opts=d[3].map(function(o,i){var p=o.split('|');return {nl:p[0],uk:p[1],ok:i===d[4]}});
    shuffle(opts);
    var q={n:idx,sec:sec.name,lvl:d[0],nl:d[1],uk:d[2],opts:opts,expl:d[5],ans:-1};
    all.push(q);
    var c=document.createElement('div');c.className='card';c.id='q'+idx;
    var html='<div class="meta">Запитання '+(idx+1)+' / 100<span class="lvl">'+d[0]+'</span></div>';
    if(d[6]){var t=d[6].split('|');html+='<div class="txt">'+esc(t[0])+'<small>'+esc(t[1])+'</small></div>'}
    html+='<div class="q">'+esc(d[1])+'</div><div class="uk">'+esc(d[2])+'</div>';
    opts.forEach(function(o,i){
      html+='<div class="row"><label class="opt"><input type="radio" name="q'+idx+'" value="'+i+'"><span><span class="l">'+'ABCD'[i]+')</span> '+esc(o.nl)+'</span></label><button type="button" class="spk" aria-label="Прослухати" title="Прослухати">🔊</button></div>';
    });
    html+='<button class="clr" type="button">зняти позначку</button><div class="expl" style="display:none"></div>';
    c.innerHTML=html;quiz.appendChild(c);
    c.addEventListener('change',function(e){
      q.ans=+e.target.value;
      [].forEach.call(c.querySelectorAll('label.opt'),function(l,i){l.classList.toggle('sel',i===q.ans)});
      upd();
    });
    [].forEach.call(c.querySelectorAll('.spk'),function(b,i){
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();speak(opts[i].nl,b)});
    });
    c.querySelector('.clr').onclick=function(){
      q.ans=-1;[].forEach.call(c.querySelectorAll('input'),function(i){i.checked=false});
      [].forEach.call(c.querySelectorAll('label.opt'),function(l){l.classList.remove('sel')});upd();
    };
  });
});
function upd(){
  var a=all.filter(function(q){return q.ans>=0}).length;
  document.getElementById('cnt').textContent=a+' / '+all.length;
  document.querySelector('#prog i').style.width=(a/all.length*100)+'%';
}
document.getElementById('finish').onclick=function(){
  var un=all.filter(function(q){return q.ans<0});
  if(un.length&&!confirm('Без відповіді: '+un.length+'. Завершити тест?'))return;
  var score=0,wrong=[],bySec={},byLvl={A1:[0,0],A2:[0,0]};
  all.forEach(function(q){
    var ok=q.ans>=0&&q.opts[q.ans].ok;
    if(ok)score++;else wrong.push(q);
    bySec[q.sec]=bySec[q.sec]||[0,0];bySec[q.sec][1]++;byLvl[q.lvl][1]++;
    if(ok){bySec[q.sec][0]++;byLvl[q.lvl][0]++}
    var c=document.getElementById('q'+q.n);
    [].forEach.call(c.querySelectorAll('label.opt'),function(l,i){
      l.classList.remove('sel');
      if(q.opts[i].ok)l.classList.add('right');else if(i===q.ans)l.classList.add('wrong');
    });
    [].forEach.call(c.querySelectorAll('input'),function(i){i.disabled=true});
    c.querySelector('.clr').style.display='none';
    var ex=c.querySelector('.expl');ex.style.display='block';
    var right='ABCD'[q.opts.findIndex(function(o){return o.ok})];
    ex.innerHTML=(ok?'✅ <b>Правильно.</b> ':(q.ans<0?'⚠️ <b>Без відповіді.</b> ':'❌ <b>Неправильно.</b> '))+'Правильна відповідь: <b>'+right+'</b>.<br>'+esc(q.expl);
    if(!ok)c.classList.add('miss');
  });
  var pct=Math.round(score/all.length*100);
  var lvl=pct<30?'нижче A1 — почніть з основ':pct<50?'A1 (початковий)':pct<65?'A1+ (вище початкового)':pct<80?'A2 (базовий)':'A2+ (впевнений A2)';
  var tip=[];
  Object.keys(bySec).forEach(function(k){if(bySec[k][0]/bySec[k][1]<.7)tip.push(k)});
  var h='<div class="score"><div>Ваш результат</div><div class="big">'+score+' / '+all.length+'</div><div><b>'+pct+'%</b> правильних відповідей</div><div style="margin-top:6px">Орієнтовний рівень: <b>'+lvl+'</b></div>';
  h+='<table class="tbl"><tr><th>Розділ</th><th>Бали</th></tr>';
  Object.keys(bySec).forEach(function(k){h+='<tr><td>'+k+'</td><td>'+bySec[k][0]+' / '+bySec[k][1]+'</td></tr>'});
  h+='<tr><td>Рівень A1</td><td>'+byLvl.A1[0]+' / '+byLvl.A1[1]+'</td></tr><tr><td>Рівень A2</td><td>'+byLvl.A2[0]+' / '+byLvl.A2[1]+'</td></tr></table>';
  h+='<p style="text-align:left">'+(tip.length?'<b>Що покращити:</b> '+tip.join(', ')+'.':'<b>Чудовий результат!</b> Продовжуйте практику та переходьте до B1.')+'</p>';
  h+='<p style="text-align:left">Помилок: <b>'+wrong.length+'</b>. Пояснення — під кожним запитанням (червоні рамки — помилки). Список помилок:</p>';
  if(wrong.length){h+='<ol style="text-align:left;padding-left:20px">'+wrong.map(function(q){return '<li><a href="#q'+q.n+'">Запитання '+(q.n+1)+'</a> — '+esc(q.nl)+'</li>'}).join('')+'</ol>'}
  h+='</div><button class="main sec2" onclick="location.reload()">Пройти ще раз</button>';
  var r=document.getElementById('res');r.innerHTML=h;r.style.display='block';
  document.getElementById('finish').style.display='none';
  r.scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
